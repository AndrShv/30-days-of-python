version: '3.8'

services:
  greenhouse-db:
    image: postgres:15-alpine
    container_name: greenhouse_postgres
    restart: always
    environment:
      POSTGRES_USER: greenhouse_user
      POSTGRES_PASSWORD: greenhouse_secure_pass
      POSTGRES_DB: greenhouse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
